<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck OS Terms of Use</title>
  <link rel="icon" href="img/icon.png">
  <style>
    body { background: #08090c; color: #e3ebf3; font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    a { color: #32e0c4; }
    pre { white-space: pre-wrap; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">← Deck OS</a></p>
    <pre id="terms">Loading…</pre>
  </main>
  <script>
    fetch("TERMS.txt").then((r) => r.text()).then((t) => (document.getElementById("terms").textContent = t))
      .catch(() => (document.getElementById("terms").innerHTML = 'Couldn\'t load - <a href="TERMS.txt">open the text file</a>.'));
  </script>
</body>
</html>
